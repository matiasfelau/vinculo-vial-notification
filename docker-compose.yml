services:
  notification:
    container_name: vinculo-vial-notification
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    networks:
      - vinculo-vial
      - notification-internal
    depends_on:
      notification-db:
        condition: service_healthy

  # Servidor SMTP de desarrollo (US-13): recibe los emails sin entregarlos.
  # El SMTP (1025) solo es alcanzable dentro de notification-internal, como
  # "mailpit:1025"; la bandeja web se publica unicamente en el loopback del
  # host, porque los mails contienen codigos de un solo uso.
  mailpit:
    container_name: vinculo-vial-mailpit
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - notification-internal
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 5

  notification-db:
    container_name: vinculo-vial-notification-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    networks:
      - notification-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  vinculo-vial:
    external: true
  notification-internal:
    driver: bridge

volumes:
  notification-db-data:
