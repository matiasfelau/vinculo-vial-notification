name: build-test-release

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

env:
  # Versiones de las herramientas de CI, fijadas para que el resultado sea reproducible.
  GOCOVMERGE_VERSION: b5bfa59ec0ad # github.com/wadey/gocovmerge (sin releases; commit de 2016-03-31)
  GOCOVER_COBERTURA_VERSION: v1.5.0
  GOVULNCHECK_VERSION: v1.9.0
  DIFF_COVER_VERSION: 11.0.2
  SEMGREP_VERSION: 1.185.0
  COVERAGE_THRESHOLD: "85"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Postgres real para las pruebas de integracion: SQLite y el doble
    # en memoria no reproducen el bloqueo de un INSERT ... ON CONFLICT
    # DO NOTHING sobre una fila sin confirmar, que sostiene la
    # idempotencia por event_id.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notification_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d notification_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # diff-cover necesita el historial para comparar con la rama base del PR.
          fetch-depth: 0

      - name: Configurar Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Descargar y verificar dependencias
        run: |
          go mod download
          go mod verify

      - name: Compilar
        run: go build ./...

      - name: Verificar formato
        run: |
          fmt_diff="$(gofmt -l .)"
          if [ -n "$fmt_diff" ]; then
            echo "Archivos sin formatear:"
            echo "$fmt_diff"
            exit 1
          fi

      - name: Analisis estatico
        run: |
          go vet ./...
          go vet -tags=integration ./...

      # -coverpkg=./... hace que cada perfil mida todo el repo, no solo el paquete que corre la
      # prueba: un código cubierto desde otro paquete cuenta.
      - name: Ejecutar pruebas
        run: go test ./... -race -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage-unit.out

      - name: Ejecutar pruebas de integracion (Postgres real)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/notification_test?sslmode=disable
        run: go test -tags=integration -race -count=1 -run Integracion -v -covermode=atomic -coverpkg=./... -coverprofile=coverage-integration.out ./internal/repository/postgres/

      - name: Unir perfiles y convertir a Cobertura XML
        run: |
          go install "github.com/wadey/gocovmerge@${GOCOVMERGE_VERSION}"
          go install "github.com/boumenot/gocover-cobertura@${GOCOVER_COBERTURA_VERSION}"
          gocovmerge coverage-unit.out coverage-integration.out > coverage.out
          # El tag es necesario: sin él gocover-cobertura no encuentra los archivos que solo existen
          # con "integration".
          GOFLAGS=-tags=integration gocover-cobertura < coverage.out > coverage.xml

      # Se publica en el resumen del job. El gate sobre el total entra con el PR de cobertura.
      - name: Publicar la cobertura total
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}')"
          {
            echo "## Cobertura total"
            echo
            echo "**${total}** de las sentencias (pruebas unitarias e integración unidas)."
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out > coverage-func.txt

      - name: Subir reportes de cobertura
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura
          path: |
            coverage.out
            coverage.xml
            coverage-func.txt
          if-no-files-found: ignore

      # Solo en PR: en un push no hay rama contra la que comparar.
      - name: Gate de cobertura sobre el código nuevo
        if: github.event_name == 'pull_request'
        env:
          # Por variable de entorno y no interpolado en el script: el nombre de la rama lo
          # controla quien abre el PR (inyección de shell).
          BASE_REF: ${{ github.base_ref }}
        run: |
          python -m pip install --quiet "diff-cover==${DIFF_COVER_VERSION}"
          git fetch --no-tags origin "$BASE_REF"
          status=0
          diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --fail-under="${COVERAGE_THRESHOLD}" \
            --format "markdown:diff-cover.md" || status=$?
          {
            echo "## Cobertura del código nuevo (mínimo ${COVERAGE_THRESHOLD} %)"
            echo
            cat diff-cover.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # Falla ante vulnerabilidades alcanzables. No actualiza dependencias.
      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

      # Las excepciones viven solo en .trivyignore, con el motivo y la fecha de revisión.
      - name: Trivy (vulnerabilidades, secretos y configuración)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      # Informativo por ahora: no corta el job. Pasa a gate en v0.14.
      - name: Semgrep
        continue-on-error: true
        run: |
          python -m pip install --quiet "semgrep==${SEMGREP_VERSION}"
          semgrep scan --config p/default --json --output semgrep.json || true
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections
          results = json.load(open("semgrep.json")).get("results", [])
          por_severidad = collections.Counter(r["extra"]["severity"] for r in results)
          print("## Semgrep (informativo)")
          print()
          if not results:
              print("Sin hallazgos.")
          else:
              print(f"{len(results)} hallazgos: " + ", ".join(f"{n} {s}" for s, n in sorted(por_severidad.items())))
              print()
              for r in results[:20]:
                  print(f"- `{r['path']}:{r['start']['line']}` {r['check_id']}")
          PY
